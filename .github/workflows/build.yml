name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run pack
      - uses: actions/upload-artifact@v4
        with:
          name: markgraf-browser-extension
          path: dist/*.zip
          if-no-files-found: error
